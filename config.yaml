# Video Fabrikası — üretim ayarları (tüm kanallar için varsayılanlar)
# Ücretsizden ücretliye geçiş: sadece ilgili "provider" satırını değiştir,
# gerekli API anahtarını .env dosyasına ekle. Kodda değişiklik gerekmez.

factory:
  default_channel: homo-athleticus
  host: 127.0.0.1
  port: 8765

video:
  width: 1920
  height: 1080
  fps: 30
  zoom: 0.08          # her sahne boyunca kamera hareketi (yakınlaşma/kaydırma oranı; 0 = sabit)
  crf: 20             # kalite (düşük = daha kaliteli, daha büyük dosya)
  transitions: true   # sahneler arasında yumuşak geçiş
  xfade_frames: 10    # geçiş uzunluğu (kare)

split:                # altyazı/çeviri birimi (shot). Görsel sahne başına: bir resim 2–4 shot boyunca kalır
  min_chars: 20
  max_chars: 65

# 1) Senaryo → sahne planı ve çeviri
planner:
  provider: gemini    # gemini (tek tık, görsellerle aynı anahtar, ~0,05 $/video) | anthropic (ücretli API) | manual (Claude sohbetinde kopyala-yapıştır)
  gemini:
    model: gemini-3.8-flash
    batch_size: 60    # bir istekte planlanacak shot sayısı
  anthropic:
    model: claude-sonnet-5
    batch_size: 60

# 2) Seslendirme
tts:
  provider: kokoro    # kokoro (ücretsiz, yerel) | edge (ücretsiz, çevrimiçi) | elevenlabs (ücretli) | gemini (ucuz, yönetilebilir) | estimate (sessiz deneme)
  provider_by_lang:   # dile özel seçim (Kokoro Türkçe bilmiyor)
    tr: edge
  kokoro:
    voice: am_michael # am_michael, am_fenrir, bm_george, af_heart ...
    speed: 1.0
    lang_code: a      # a = Amerikan İngilizcesi, b = İngiliz İngilizcesi
  edge:
    voice_by_lang: {en: en-US-GuyNeural, tr: tr-TR-AhmetNeural}
    rate: "+0%"
  elevenlabs:
    voice_id: ""      # ElevenLabs panelinden (Türkçe dahil çok dilli)
    model: eleven_multilingual_v2   # eleven_v3 = duygu etiketleri: script.md'de "[curious] Why...?", "[excited]", "[whispers]", "[pause]"
    tags: true          # eleven_v3 ile etiketleri sese gönder (false = yok say). Altyazıya/görsele hiç girmezler
    settings:           # anlatım tarzı: düşük stability + style = daha canlı, vurgulu okuma
      stability: 0.35   # 0.3–0.5 arası; düştükçe daha duygulu ama daha az tutarlı
      similarity_boost: 0.8
      style: 0.4        # 0 = düz, 0.5+ = abartılı olabilir
      use_speaker_boost: true
      speed: 1.05       # enerjik tempo (0.7–1.2)
  gemini:              # GEMINI_API_KEY ile; ~0,25 $ / 7-8 dk video
    model: gemini-3.8-flash-tts
    fallback_model: gemini-3.1-flash-tts-preview
    voice: Leda         # kadın: Leda (genç), Zephyr (parlak), Laomedeia (neşeli), Autonoe, Aoede, Kore
    voice_by_lang: {}   # ör. {tr: Leda}
    style: >-           # söylenmez, sadece okumayı yönetir
      An energetic young woman presenting a popular science YouTube channel. Warm, curious and confident.
      Let questions rise with genuine curiosity, lean into surprising numbers, and take a short pause before
      each reveal. Natural conversational pace, never shouting, never robotic.
  paragraph_pause: 0.35   # paragraflar arası sessizlik (sn)
  question_tag: curious   # etiketli sesle (eleven_v3): kendi etiketi olmayan her soru cümlesine bu ton ("" = kapalı)

# 3) Ses ↔ metin zamanlaması
align:
  provider: auto      # auto | whisper | proportional
  whisper:
    model: base.en    # tiny.en (hızlı) | base.en | small.en (daha doğru)
    device: cpu       # cpu (her bilgisayarda çalışır) | cuda (NVIDIA + CUDA 12 kütüphaneleri kuruluysa daha hızlı)

# 4) Görseller: her sahne bir AI resmi (stil ve karakterler channel.yaml'da). Grafikler kodla çizilir (ücretsiz)
images:
  concurrency: 4
  gemini:
    # gemini-3.1-flash-image (Nano Banana 2, önerilen, ~0,05 $/resim) | gemini-3-pro-image (Pro: en tutarlı, ~3 kat pahalı)
    model: gemini-3.1-flash-image
    aspect_ratio: "16:9"
    image_size: ""    # "" = 1K (varsayılan) | "2K" daha keskin, daha pahalı
    retries: 3

# 4b) İkinci dil: aynı videoya ek ses izi (YouTube → Diller → Ses parçası ekle)
dub:
  max_tempo: 1.15     # uzun kalan çeviri paragrafı en fazla bu kadar hızlandırılır

# 5) Kurgu ve ses miksajı
audio:
  music: ""           # assets/music/ altındaki dosya adı (boş = müziksiz)
  music_volume: 0.07  # konuşma yokken ~2 katı; konuşurken otomatik kısılır (duck)
  duck: true
  sfx: true           # sahne değişiminde "whoosh", yeni nesnede "pop" (assets/sfx/whoosh.wav, pop.wav ile değiştirilebilir)
  sfx_volume: 0.35
  target_lufs: -14
