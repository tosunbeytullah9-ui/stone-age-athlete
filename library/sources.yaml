# Shared source library — every channel and every video cites sources from here by id.
# id: short and stable (firstauthorYEAR, e.g. ilardo2018). Never change an id that a claims.yaml uses.
# type: meta-analysis | review | primary | dataset | book | guideline | news | other  (prefer primary/review)
# population / method / limits: what the study can and cannot tell us — used for caveats in scripts.
# link: filled by "Bağlantıları kontrol et" (python -m studio check-links)
sources:
- {id: macintosh2017, title: Prehistoric women's manual work was tougher than rowing in today's elite boat crews, authors: 'Macintosh AA, Pinhasi R, Stock JT', year: 2017, venue: Science Advances, doi: 10.1126/sciadv.aao3893, url: 'https://www.cam.ac.uk/research/news/prehistoric-womens-manual-work-was-tougher-than-rowing-in-todays-elite-boat-crews', type: primary, population: 'Central European women, Early Neolithic to Medieval, vs living Cambridge University women (rowers, runners, footballers, controls)', method: CT/laser scans of humerus and tibia; cross-sectional bending rigidity, limits: Group averages; bone rigidity is not athletic performance; grinding hours are an ethnographic estimate, tags: [bone, women, neolithic, rowing]}
- {id: ryanshaw2015, title: Gracility of the modern Homo sapiens skeleton is the result of decreased biomechanical loading, authors: 'Ryan TM, Shaw CN', year: 2015, venue: PNAS, url: 'https://www.sciencedaily.com/releases/2014/12/141222165033.htm', type: primary, population: Foragers vs later agriculturalists (North America), method: Trabecular bone micro-CT of hip joints, limits: Press summary linked; check the paper for exact percentages, tags: [bone, farming]}
- {id: raichlen2017, title: Physical activity patterns and biomarkers of cardiovascular disease risk in hunter-gatherers, authors: Raichlen DA et al., year: 2017, venue: American Journal of Human Biology, url: 'https://pubmed.ncbi.nlm.nih.gov/27723159/', type: primary, population: 'Hadza adults, Tanzania', method: Heart-rate monitoring, limits: One population; MVPA from heart rate, tags: [hadza, activity]}
- {id: pontzer2012, title: Hunter-gatherer energetics and human obesity, authors: Pontzer H et al., year: 2012, venue: PLOS ONE, url: 'https://www.sciencedaily.com/releases/2012/07/120725200304.htm', type: primary, population: Hadza adults, method: Doubly labelled water, limits: Small sample; press summary linked, tags: [hadza, energy]}
- {id: morin2024, title: Ethnography and ethnohistory support the efficiency of hunting through endurance running in humans, authors: 'Morin E, Winterhalder B', year: 2024, venue: Nature Human Behaviour, url: 'https://phys.org/news/2024-05-theory-humans-evolved-ability-distances.html', type: primary, population: ~400 historical and ethnographic accounts, method: Review of written accounts + energetic model, limits: Historical accounts vary in reliability, tags: [running, hunting]}
- {id: stieglitz2019, title: Tsimane fracture study (verify title and numbers before use), authors: Stieglitz J et al., year: 2019, venue: eLife, url: 'https://elifesciences.org/articles/48607', type: primary, population: 'Tsimane forager-horticulturalists, Bolivia', limits: Not yet checked, tags: [tsimane, injury]}
