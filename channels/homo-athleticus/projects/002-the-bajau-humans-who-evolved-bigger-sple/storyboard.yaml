title: 002-the-bajau-humans-who-evolved-bigger-sple
paragraphs: 27
shots:
- id: s001
  para: 0
  sent: 0
  text: 'The Bajau: Humans Who Evolved Bigger Spleens to Dive'
  visual: null
- id: s002
  para: 1
  sent: 1
  text: Take a deep breath and hold it.
  visual: null
- id: s003
  para: 1
  sent: 2
  text: Right now.
  visual: null
- id: s004
  para: 1
  sent: 3
  text: Most of you will want to breathe again in under a minute.
  visual: null
- id: s005
  para: 1
  sent: 4
  text: Now imagine doing that over and over, all day,
  visual: null
- id: s006
  para: 1
  sent: 4
  text: while you hunt fish on the sea floor.
  visual: null
- id: s007
  para: 1
  sent: 5
  text: For the Bajau people, that is not a stunt.
  visual: null
- id: s008
  para: 1
  sent: 6
  text: It is a working day.
  visual: null
- id: s009
  para: 2
  sent: 7
  text: The Bajau are often called the sea nomads of Southeast Asia.
  visual: null
- id: s010
  para: 2
  sent: 8
  text: They live in the waters around Indonesia,
  visual: null
- id: s011
  para: 2
  sent: 8
  text: Malaysia and the Philippines.
  visual: null
- id: s012
  para: 2
  sent: 9
  text: For generations,
  visual: null
- id: s013
  para: 2
  sent: 9
  text: many of them lived on houseboats and came to land only to trade.
  visual: null
- id: s014
  para: 2
  sent: 10
  text: Linguistic studies suggest they have lived this way
  visual: null
- id: s015
  para: 2
  sent: 10
  text: for more than a thousand years.
  visual: null
- id: s016
  para: 2
  sent: 11
  text: And when Magellan's expedition crossed these waters in 1521,
  visual: null
- id: s017
  para: 2
  sent: 11
  text: European sailors wrote about them.
  visual: null
- id: s018
  para: 3
  sent: 12
  text: So what does their working day look like?
  visual: null
- id: s019
  para: 3
  sent: 13
  text: In one field study,
  visual: null
- id: s020
  para: 3
  sent: 13
  text: Bajau divers spent more than five hours a day underwater.
  visual: null
- id: s021
  para: 3
  sent: 14
  text: That was about sixty percent of their working time.
  visual: null
- id: s022
  para: 3
  sent: 15
  text: For comparison, the Japanese Ama divers,
  visual: null
- id: s023
  para: 3
  sent: 15
  text: famous for their own breath-hold tradition,
  visual: null
- id: s024
  para: 3
  sent: 15
  text: spent about two hours a day underwater in the same study.
  visual: null
- id: s025
  para: 3
  sent: 16
  text: The Bajau dive, rise, rest for a few breaths, and dive again.
  visual: null
- id: s026
  para: 3
  sent: 17
  text: A single dive usually lasts around half a minute.
  visual: null
- id: s027
  para: 3
  sent: 18
  text: But they repeat it hundreds of times.
  visual: null
- id: s028
  para: 4
  sent: 19
  text: They do it with almost no equipment.
  visual: null
- id: s029
  para: 4
  sent: 20
  text: A spear.
  visual: null
- id: s030
  para: 4
  sent: 21
  text: A pair of hand-made wooden goggles.
  visual: null
- id: s031
  para: 4
  sent: 22
  text: No fins, no wetsuit, no air tank.
  visual: null
- id: s032
  para: 4
  sent: 23
  text: Some reports describe Bajau divers reaching depths
  visual: null
- id: s033
  para: 4
  sent: 23
  text: of more than seventy metres.
  visual: null
- id: s034
  para: 4
  sent: 24
  text: Others, looking at ordinary village divers,
  visual: null
- id: s035
  para: 4
  sent: 24
  text: saw much shallower work, around ten metres.
  visual: null
- id: s036
  para: 4
  sent: 25
  text: The honest answer is that it varies.
  visual: null
- id: s037
  para: 4
  sent: 26
  text: But even the shallow version, repeated all day,
  visual: null
- id: s038
  para: 4
  sent: 26
  text: is something your body is not built for.
  visual: null
- id: s039
  para: 4
  sent: 27
  text: Or is it?
  visual: null
- id: s040
  para: 5
  sent: 28
  text: Here is the question that pulled scientists in.
  visual: null
- id: s041
  para: 5
  sent: 29
  text: Is this skill, or is it biology?
  visual: null
- id: s042
  para: 5
  sent: 30
  text: Can anyone who grows up in the water learn to do this?
  visual: null
- id: s043
  para: 5
  sent: 31
  text: Or has the sea changed the Bajau themselves?
  visual: null
- id: s044
  para: 6
  sent: 32
  text: To answer that, you first need to know about a small
  visual: null
- id: s045
  para: 6
  sent: 32
  text: organ you probably never think about.
  visual: null
- id: s046
  para: 6
  sent: 33
  text: Your spleen.
  visual: null
- id: s047
  para: 6
  sent: 34
  text: It sits under your left ribs, about the size of your fist.
  visual: null
- id: s048
  para: 6
  sent: 35
  text: Most people know it as a filter for the blood.
  visual: null
- id: s049
  para: 6
  sent: 36
  text: But it also works as a reserve tank.
  visual: null
- id: s050
  para: 6
  sent: 37
  text: It stores red blood cells, the cells that carry oxygen.
  visual: null
- id: s051
  para: 7
  sent: 38
  text: When you hold your breath and put your face in cold water,
  visual: null
- id: s052
  para: 7
  sent: 38
  text: your body switches into a special mode.
  visual: null
- id: s053
  para: 7
  sent: 39
  text: Scientists call it the diving response.
  visual: null
- id: s054
  para: 7
  sent: 40
  text: Your heart slows down.
  visual: null
- id: s055
  para: 7
  sent: 41
  text: The blood vessels in your arms and legs tighten,
  visual: null
- id: s056
  para: 7
  sent: 41
  text: so blood stays around your heart and brain.
  visual: null
- id: s057
  para: 7
  sent: 42
  text: And your spleen squeezes.
  visual: null
- id: s058
  para: 7
  sent: 43
  text: It pushes its stored red blood cells into the bloodstream.
  visual: null
- id: s059
  para: 7
  sent: 44
  text: It is like a scuba diver opening a spare oxygen bottle.
  visual: null
- id: s060
  para: 8
  sent: 45
  text: You have this response too.
  visual: null
- id: s061
  para: 8
  sent: 46
  text: Every human does.
  visual: null
- id: s062
  para: 8
  sent: 47
  text: In trained breath-hold divers,
  visual: null
- id: s063
  para: 8
  sent: 47
  text: researchers measured the spleen shrinking by
  visual: null
- id: s064
  para: 8
  sent: 47
  text: about a quarter after a series of breath-holds.
  visual: null
- id: s065
  para: 8
  sent: 48
  text: That is the spleen emptying its reserve.
  visual: null
- id: s066
  para: 9
  sent: 49
  text: Now think about seals.
  visual: null
- id: s067
  para: 9
  sent: 50
  text: Deep-diving seals, like the Weddell seal,
  visual: null
- id: s068
  para: 9
  sent: 50
  text: have enormous spleens compared to their body size.
  visual: null
- id: s069
  para: 9
  sent: 51
  text: A bigger tank means more oxygen on demand.
  visual: null
- id: s070
  para: 9
  sent: 52
  text: A young geneticist named Melissa Ilardo noticed this
  visual: null
- id: s071
  para: 9
  sent: 52
  text: and asked a simple question.
  visual: null
- id: s072
  para: 9
  sent: 53
  text: If seals evolved bigger spleens for diving,
  visual: null
- id: s073
  para: 9
  sent: 53
  text: could humans do the same?
  visual: null
- id: s074
  para: 10
  sent: 54
  text: So she went to Indonesia.
  visual: null
- id: s075
  para: 10
  sent: 55
  text: She lived in a Bajau village
  visual: null
- id: s076
  para: 10
  sent: 55
  text: and brought a portable ultrasound machine.
  visual: null
- id: s077
  para: 10
  sent: 56
  text: She measured the spleens of fifty-nine Bajau people.
  visual: null
- id: s078
  para: 10
  sent: 57
  text: Then she measured thirty-four people from the Saluan,
  visual: null
- id: s079
  para: 10
  sent: 57
  text: a neighbouring group that lives on land and does not dive.
  visual: null
- id: s080
  para: 10
  sent: 58
  text: Same region.
  visual: null
- id: s081
  para: 10
  sent: 59
  text: Same kind of food.
  visual: null
- id: s082
  para: 10
  sent: 60
  text: Different life.
  visual: null
- id: s083
  para: 11
  sent: 61
  text: The result was striking.
  visual: null
- id: s084
  para: 11
  sent: 62
  text: The Bajau spleens were about fifty percent larger
  visual: null
- id: s085
  para: 11
  sent: 62
  text: than the Saluan spleens.
  visual: null
- id: s086
  para: 11
  sent: 63
  text: By the researchers' estimate,
  visual: null
- id: s087
  para: 11
  sent: 63
  text: that could mean around ten percent more
  visual: null
- id: s088
  para: 11
  sent: 63
  text: red blood cells released during a dive.
  visual: null
- id: s089
  para: 12
  sent: 64
  text: But here is the part that really matters.
  visual: null
- id: s090
  para: 12
  sent: 65
  text: A bigger spleen could simply come from training.
  visual: null
- id: s091
  para: 12
  sent: 66
  text: Muscles grow when you use them.
  visual: null
- id: s092
  para: 12
  sent: 67
  text: Maybe spleens do too.
  visual: null
- id: s093
  para: 12
  sent: 68
  text: So the team checked Bajau people who did not dive.
  visual: null
- id: s094
  para: 12
  sent: 69
  text: And their spleens were just as large
  visual: null
- id: s095
  para: 12
  sent: 69
  text: as those of the Bajau divers.
  visual: null
- id: s096
  para: 12
  sent: 70
  text: There was no difference.
  visual: null
- id: s097
  para: 13
  sent: 71
  text: That points away from training and toward inheritance.
  visual: null
- id: s098
  para: 13
  sent: 72
  text: The team then looked at Bajau DNA.
  visual: null
- id: s099
  para: 13
  sent: 73
  text: They found signs of natural selection on a gene called PDE10A.
  visual: null
- id: s100
  para: 13
  sent: 74
  text: In the study, this gene was linked to spleen size,
  visual: null
- id: s101
  para: 13
  sent: 74
  text: possibly through thyroid hormone.
  visual: null
- id: s102
  para: 13
  sent: 75
  text: They also found signs of selection on a gene called BDKRB2,
  visual: null
- id: s103
  para: 13
  sent: 75
  text: which is linked to the diving response itself,
  visual: null
- id: s104
  para: 13
  sent: 75
  text: the tightening of blood vessels.
  visual: null
- id: s105
  para: 13
  sent: 76
  text: In other words,
  visual: null
- id: s106
  para: 13
  sent: 76
  text: the sea may have shaped the Bajau body over many generations.
  visual: null
- id: s107
  para: 13
  sent: 77
  text: People with a slightly better diving body brought home more food,
  visual: null
- id: s108
  para: 13
  sent: 77
  text: and passed on their genes.
  visual: null
- id: s109
  para: 14
  sent: 78
  text: This was published in 2018 in the journal Cell.
  visual: null
- id: s110
  para: 14
  sent: 79
  text: It became one of the clearest examples
  visual: null
- id: s111
  para: 14
  sent: 79
  text: of recent human adaptation to a way of life.
  visual: null
- id: s112
  para: 14
  sent: 80
  text: Not to a climate.
  visual: null
- id: s113
  para: 14
  sent: 81
  text: Not to altitude.
  visual: null
- id: s114
  para: 14
  sent: 82
  text: To a job.
  visual: null
- id: s115
  para: 15
  sent: 83
  text: And this is where we have to slow down.
  visual: null
- id: s116
  para: 15
  sent: 84
  text: Because the story is great, but the evidence has limits.
  visual: null
- id: s117
  para: 16
  sent: 85
  text: First, this is one study,
  visual: null
- id: s118
  para: 16
  sent: 85
  text: in one Bajau community,
  visual: null
- id: s119
  para: 16
  sent: 85
  text: with fewer than one hundred people measured.
  visual: null
- id: s120
  para: 16
  sent: 86
  text: It is a strong start, not the final word.
  visual: null
- id: s121
  para: 17
  sent: 87
  text: Second, the researchers themselves said almost nothing is known
  visual: null
- id: s122
  para: 17
  sent: 87
  text: about the genetics of human spleen size.
  visual: null
- id: s123
  para: 17
  sent: 88
  text: The gene link is a clue, not a finished explanation.
  visual: null
- id: s124
  para: 18
  sent: 89
  text: Third, a bigger spleen is only one piece.
  visual: null
- id: s125
  para: 18
  sent: 90
  text: The Bajau also grow up in the water.
  visual: null
- id: s126
  para: 18
  sent: 91
  text: In one village,
  visual: null
- id: s127
  para: 18
  sent: 91
  text: children learned to swim at around three or four years old,
  visual: null
- id: s128
  para: 18
  sent: 91
  text: simply by watching and copying.
  visual: null
- id: s129
  para: 18
  sent: 92
  text: They learn how to move calmly, how to equalise,
  visual: null
- id: s130
  para: 18
  sent: 92
  text: how to stay relaxed.
  visual: null
- id: s131
  para: 18
  sent: 93
  text: That skill matters as much as any gene.
  visual: null
- id: s132
  para: 18
  sent: 94
  text: So the honest picture is not "genes instead
  visual: null
- id: s133
  para: 18
  sent: 94
  text: of training." It is genes and training, together, over a lifetime.
  visual: null
- id: s134
  para: 19
  sent: 95
  text: And fourth, the diving life has a cost.
  visual: null
- id: s135
  para: 19
  sent: 96
  text: Ear damage is common among Bajau divers.
  visual: null
- id: s136
  para: 19
  sent: 97
  text: Some people online claim they burst their eardrums on purpose.
  visual: null
- id: s137
  para: 19
  sent: 98
  text: When a journalist asked,
  visual: null
- id: s138
  para: 19
  sent: 98
  text: a Bajau diver said they do not do it on purpose.
  visual: null
- id: s139
  para: 19
  sent: 99
  text: It happens.
  visual: null
- id: s140
  para: 19
  sent: 100
  text: Their way of life is also changing.
  visual: null
- id: s141
  para: 19
  sent: 101
  text: Many families have moved from boats to houses on stilts,
  visual: null
- id: s142
  para: 19
  sent: 101
  text: and fewer children grow up diving every day.
  visual: null
- id: s143
  para: 20
  sent: 102
  text: So what can you take from the Bajau?
  visual: null
- id: s144
  para: 20
  sent: 103
  text: You will not grow a Bajau spleen by watching this video.
  visual: null
- id: s145
  para: 20
  sent: 104
  text: But the diving response is in you,
  visual: null
- id: s146
  para: 20
  sent: 104
  text: and parts of it respond to training.
  visual: null
- id: s147
  para: 21
  sent: 105
  text: In one study, people did eight weeks of breath-hold training.
  visual: null
- id: s148
  para: 21
  sent: 106
  text: Their resting spleen size went up,
  visual: null
- id: s149
  para: 21
  sent: 106
  text: from about two hundred and forty to three hundred millilitres.
  visual: null
- id: s150
  para: 21
  sent: 107
  text: Interesting.
  visual: null
- id: s151
  para: 21
  sent: 108
  text: But the amount the spleen squeezed
  visual: null
- id: s152
  para: 21
  sent: 108
  text: during a breath-hold did not change.
  visual: null
- id: s153
  para: 21
  sent: 109
  text: So training changed something,
  visual: null
- id: s154
  para: 21
  sent: 109
  text: but it did not turn them into Bajau.
  visual: null
- id: s155
  para: 22
  sent: 110
  text: Here is the coach's lesson.
  visual: null
- id: s156
  para: 23
  sent: 111
  text: One.
  visual: null
- id: s157
  para: 23
  sent: 112
  text: Your body has systems you never use.
  visual: null
- id: s158
  para: 23
  sent: 113
  text: The diving response is one of them.
  visual: null
- id: s159
  para: 23
  sent: 114
  text: The Bajau show how far a human body can go
  visual: null
- id: s160
  para: 23
  sent: 114
  text: when a life depends on it,
  visual: null
- id: s161
  para: 23
  sent: 114
  text: and when that life is repeated for a thousand years.
  visual: null
- id: s162
  para: 24
  sent: 115
  text: Two.
  visual: null
- id: s163
  para: 24
  sent: 116
  text: Genes set the ceiling.
  visual: null
- id: s164
  para: 24
  sent: 117
  text: Practice decides how close you get to it.
  visual: null
- id: s165
  para: 24
  sent: 118
  text: The Bajau have both.
  visual: null
- id: s166
  para: 24
  sent: 119
  text: Most of us only control the second one,
  visual: null
- id: s167
  para: 24
  sent: 119
  text: and that is enough to make real progress.
  visual: null
- id: s168
  para: 25
  sent: 120
  text: Three.
  visual: null
- id: s169
  para: 25
  sent: 121
  text: And this one is not optional.
  visual: null
- id: s170
  para: 25
  sent: 122
  text: Never practise breath-holding in water on your own.
  visual: null
- id: s171
  para: 25
  sent: 123
  text: Not in a pool, not in the sea, not in a bath.
  visual: null
- id: s172
  para: 25
  sent: 124
  text: When you hold your breath for long,
  visual: null
- id: s173
  para: 25
  sent: 124
  text: you can lose consciousness without any warning.
  visual: null
- id: s174
  para: 25
  sent: 125
  text: It is called shallow water blackout,
  visual: null
- id: s175
  para: 25
  sent: 125
  text: and it has killed strong, fit swimmers.
  visual: null
- id: s176
  para: 25
  sent: 126
  text: Breathing fast before you go under makes it more dangerous, not less.
  visual: null
- id: s177
  para: 25
  sent: 127
  text: If you want to train your breath-hold, do it on dry land,
  visual: null
- id: s178
  para: 25
  sent: 127
  text: sitting or lying down,
  visual: null
- id: s179
  para: 25
  sent: 127
  text: and freedive only with a trained buddy watching you.
  visual: null
- id: s180
  para: 26
  sent: 128
  text: The Bajau did not become sea people in one lifetime.
  visual: null
- id: s181
  para: 26
  sent: 129
  text: They became sea people over a thousand years.
  visual: null
- id: s182
  para: 26
  sent: 130
  text: Respect the water the way they do.
  visual: null
