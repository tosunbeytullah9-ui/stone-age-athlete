# Claims in this video → shared library (library/sources.yaml). Set verified: true after you have
# checked the quote against the source yourself. Panel: 1 · Senaryo & kaynaklar → İddialar.
claims:
- {id: c01, text: A trained adult male chimpanzee throws a ball at about 20 mph, source: harvard2013throwing, quote: an adult male chimp that has been trained to throw can only throw a ball approximately 20 mph, shots: [s004, s005], confidence: medium, caveat: 'Press-release figure for a trained chimp, not a measured group average', on_screen: true, verified: true}
- {id: c02, text: Little League pitchers aged 12-13 routinely throw 60-70 mph; professional pitchers throw more than 90 mph, source: harvard2013throwing, shots: [s006, s007, s008, s015], confidence: medium, caveat: '''About three times faster'' is 60 / 20, a rough comparison', verified: true}
- {id: c03, text: Only humans regularly throw projectiles with high speed and accuracy; Darwin linked throwing to bipedalism freeing the arms and to hunting, source: roach2013, quote: only humans regularly throw projectiles with high speed and accuracy, shots: [s001, s002, s003, s016, s017, s018, s019, s020, s021], confidence: high, verified: true}
- {id: c04, text: 'The 2013 study measured 20 young men, 16 of them college baseball players, with motion capture', source: roach2013, shots: [s028, s029, s030, s031, s032, s033, s034], confidence: high, verified: true}
- {id: c05, text: 'Internal rotation of the upper arm during a throw can exceed 9,000 degrees per second, the fastest motion the human body produces', source: roach2013, quote: 'can exceed 9,000°/sec, is the fastest motion the human body produces', shots: [s036, s037, s038, s039, s040, s041], confidence: high, caveat: '''25 turns per second'' is simple arithmetic (9000/360); the rotation lasts only milliseconds', on_screen: true, verified: true}
- {id: c06, text: Elastic energy stored at the shoulder during arm-cocking could account for about half of the internal rotation work in a typical throw, source: roach2013, shots: [s057, s058, s059], confidence: medium, caveat: 'Model estimate: 54±15% assuming 90% of the energy is stored and returned', verified: true}
- {id: c07, text: Shoulder braces that limited arm-cocking reduced ball speed by about 8% and shoulder work during arm-cocking by about 40%, source: roach2013, shots: [s061, s062, s063, s064, s065, s066, s067, s068], confidence: high, caveat: 8±6% and 39±16%; averages with large individual variation, verified: true}
- {id: c08, text: 'Three features enable high-speed throwing: a tall mobile waist, low laterally facing shoulders, and low humeral torsion', source: roach2013, shots: [s070, s071, s072, s073, s074, s075, s076, s077, s078, s079], confidence: high, verified: true}
- {id: c09, text: 'Throwing athletes keep lower, juvenile levels of humeral torsion into adulthood, which increases power', source: roach2013, quote: 'By maintaining relatively lower, juvenile levels of torsion into adulthood, throwing athletes increase power generation', shots: [s080, s081, s082], confidence: high, verified: true}
- {id: c10, text: 'These features first appear together about 2 million years ago in Homo erectus, when archaeological evidence suggests hunting intensified; throwing to hunt probably played an important role in the evolution of Homo', source: roach2013, shots: [s084, s085, s086, s087, s088, s089, s090, s091, s092, s094, s172], confidence: medium, caveat: Inference from fossil anatomy; parts of Homo erectus shoulder anatomy are debated, on_screen: true, verified: true}
- {id: c11, text: 'The Schöningen spears, excavated in Germany in the 1990s, were long described as about 300,000 years old; a 2025 study dated them to about 200,000 years, in the time of the Neanderthals', source: schoningen2025, shots: [s100, s101, s102, s103, s104, s105, s106, s107, s108], confidence: high, caveat: Oldest well-known throwing spears; 'oldest ever found' refers to these widely cited finds, verified: true}
- {id: c12, text: 'Six trained javelin athletes hit targets at up to 20 m with replicas of the Schöningen spears (760 g and 800 g), about double the distance previously thought', source: milks2019, shots: [s115, s116, s117, s118, s119, s120, s121, s122, s114], confidence: high, caveat: 'Modern trained athletes, not ancient hunters', verified: true}
- {id: c13, text: Human shoulder and elbow ligaments and tendons are not well adapted to repeated stretching from throwing and frequently suffer laxity and tearing, source: roach2013, quote: 'not well adapted to withstanding such repeated stretching from the high torques generated by throwing, and frequently suffer from laxity and tearing', shots: [s126, s127, s128, s129, s130], confidence: high, verified: true}
- {id: c14, text: 'In skilled adult pitchers, about 64 N·m of elbow varus torque was generated shortly before maximum external rotation', source: fleisig1995, shots: [s131, s132, s133, s134, s135], confidence: high, caveat: 26 skilled adult pitchers; net joint torque, verified: true}
- {id: c15, text: A professional pitcher can throw more than 100 very fast pitches in 2-3 hours, source: harvard2013throwing, shots: [s139, s140, s175], confidence: medium, caveat: How often ancestral hunters threw is not measured, verified: true}
- {id: c16, text: 'Youth baseball guidelines name pitching while fatigued as a top injury risk and recommend at least two months a year without overhead sports, preferably three to four', source: ll-yearround, shots: [s163, s164, s166, s167, s168], confidence: medium, caveat: 'Youth baseball guideline, applied here as general advice', verified: true}
- {id: c17, text: Pitch Smart sets daily pitch limits and required rest days by age, source: mlb-pitchsmart, shots: [s165], confidence: high, verified: true}
