description: A trained chimp throws about 20 mph; a Little League kid throws 60. A Harvard motion-capture study
  found the reason in your shoulder, and it may be 2 million years old.
publish:
  title_variants: [Why Humans Are the Best Throwers on Earth, Your Shoulder Is a 2-Million-Year-Old Slingshot, 'Why
      Can''t Chimps Throw Like Us?', The Fastest Motion Your Body Makes, Why a Kid Throws 3× Faster Than a Chimp,
    The Hidden Slingshot Inside Your Shoulder, '9,000° per Second: The Science of Throwing', 'Built to Throw: 2
      Million Years in Your Shoulder', How Throwing May Have Shaped Human Evolution, 'Built to Throw, Not to Pitch
      100 Times a Night']
  hook_options:
  - {type: cold_open_stat, text: 'A trained chimpanzee throws about twenty miles an hour. A twelve-year-old throws
      sixty. Same body plan. So what changed?'}
  - {type: you, text: Pick up a ball and throw it as hard as you can. No other animal on Earth can really copy that
      move.}
  - {type: mystery, text: 'Your upper arm can spin faster than nine thousand degrees per second. Your muscles alone
      can''t do that. So where does the speed come from?'}
  shorts_ideas:
