# Idea bank — Homo Athleticus (the story of the human body). Old channel id: stone-age-athlete.
# id: never change or reuse an id — projects, signals and updates are matched by it.
# pillar: P1 ancient bodies | P2 warriors & training | P3 extreme humans | P4 human vs nature |
#         P5 body design | P6 hidden history of fitness | P7 mismatch & myths | P8 what if
# priority: A = strong demand signal + gap, B = solid, C = experimental
# demand: notes from manual YouTube search scans (Sept 2026). signals: filled by "Sinyalleri güncelle" (YouTube Data API)
# gut: your own 1-5 score. status: idea | researching | scripting | production | published | dropped
