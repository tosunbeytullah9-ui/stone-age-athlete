# Idea bank — Homo Athleticus (the story of the human body). Old channel id: stone-age-athlete.
# id: never change or reuse an id — projects, signals and updates are matched by it.
# pillar: P1 ancient bodies | P2 warriors & training | P3 extreme humans | P4 human vs nature |
#         P5 body design | P6 hidden history of fitness | P7 mismatch & myths | P8 what if
# priority: A = strong demand signal + gap, B = solid, C = experimental
# demand: notes from manual YouTube search scans (Sept 2026). signals: filled by "Sinyalleri güncelle" (YouTube Data API)
# gut: your own 1-5 score. status: idea | researching | scripting | production | published | dropped
# Every video ends with a 60-90 s "coach's lesson" (how to use this today).
pillars:
  P1: {name: Ancient Bodies, promise: What our ancestors' bodies did all day — and what that means for yours}
  P2: {name: Warriors & Training, promise: 'How history''s toughest people actually trained, ate and recovered'}
  P3: {name: Extreme Humans, promise: Living peoples whose bodies adapted to the impossible}
  P4: {name: Human vs Nature, promise: How the human body stacks up against animals and other humans}
  P5: {name: Body Design, promise: Why your body is built the way it is — evolution's wins and bugs}
  P6: {name: Hidden History of Fitness, promise: The strange origins of the things you do at the gym}
  P7: {name: Mismatch & Myths, promise: Modern habits vs an ancient body — what science actually says}
  P8: {name: What If, promise: Body thought experiments grounded in real research}

