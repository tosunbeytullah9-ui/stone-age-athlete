script: '# How Your Can Opener Cuts Steel With One Hand

  <!-- chapter: A dinner you opened with a hammer -->

  In the eighteen-twenties, explorers sailing for the Arctic carried tins of food with a strange instruction printed on them.
  Cut around the top with a hammer and a chisel. The can had been patented in eighteen ten. America''s first can opener was
  patented in eighteen fifty-eight.


  <!-- chapter: The tool in your drawer -->

  Now open your kitchen drawer. Two handles, a little crank, two tiny wheels. You squeeze, you twist, and a ring of steel
  comes loose while you barely try.


  So here is the question. How does a gadget you hardly notice slice through metal with one hand? The answer is three of the
  oldest machines in physics, folded into something the size of your fist. And the reason it took so long to invent starts
  with the can itself.


  <!-- chapter: Cans that fought back -->

  The first cans were heavy wrought iron. Many of them weighed more than the food sealed inside. Soldiers opened theirs with
  bayonets.


  Through the eighteen hundreds, can walls got thinner, and only then did real openers appear. Robert Yeates patented one
  in England in eighteen fifty-five. Ezra Warner of Waterbury, Connecticut, followed three years later.


  Warner''s tool had a sharp point to punch the lid, a curved blade to saw around it, and a guard to stop the blade sinking
  too deep. The Union Army used it during the Civil War. In a family kitchen, it was considered too dangerous.


  Stranger shapes followed. One cast-iron opener, shaped like a bull''s head, came packed with tins of salted bully beef.
  Another was a little slotted key, soldered to the can, that peeled a strip of metal away as you twisted it. Some fish tins
  still use that idea today.


  That is the first secret hiding in your drawer. A tool can only be as clever as its problem allows. The opener had to wait
  for the can to slim down.


  <!-- chapter: Machine one: the squeeze -->

  Start with the handles. When you close them, they clamp the wheels onto the rim of the can. That clamp is a lever.


  A lever trades distance for force. Physicists measure the trade with a number called mechanical advantage. It is the force
  you get out, divided by the force you put in. For a lever, it is simply a ratio of two distances from the pivot: where you
  push, and where the work happens.


  Think of a see-saw. A small child sitting far out on one end can lift a heavy bag resting close to the middle. Distance
  does half the lifting.


  On your opener, your fingers sit far from the hinge, and the wheels sit close to it. Say your hand is five times farther
  away. Then every pound of squeeze lands on the rim as roughly five pounds. Your hand only feels a firm grip.


  But a firm grip doesn''t cut anything. So where does the cutting come from?


  <!-- chapter: Machine two: the edge -->

  Look closely at the top wheel. It is a small disc with a bevelled edge, and that edge touches the lid along a tiny sliver
  of metal.


  This is where pressure comes in. Pressure is force divided by the area it pushes on. Keep the force the same, shrink the
  area, and the pressure climbs.


  It is the reason a needle breaks skin while a fingertip pressing just as hard does nothing at all.


  The cutting wheel is that needle trick, stretched into a circle. Imagine its edge meets the lid on a patch a hundred times
  smaller than your fingertip. Then the same push presses a hundred times harder on every speck of steel underneath it.


  What happens to the steel under that edge? Engineers call force spread over an area stress, the same idea as pressure inside
  a solid. Push a little, and the metal springs back. Push harder, and it bends for good. Push harder still, and it fractures.
  The cutting wheel lives right at that last line, but only along a hairline, never across the whole lid.


  And that steel is thin. Steelmakers roll the metal for food cans to somewhere between two and three and a half tenths of
  a millimetre. Against that, a concentrated edge wins. The bevel works like a wedge, forcing the metal apart as the wheel
  sinks in.


  Still, a single dent doesn''t open a can. Something has to drag that dent all the way around. What does the turning?


  <!-- chapter: Machine three: the turning -->

  That is the crank''s job, and it is a lever too, one that never stops going round. Your hand travels a wide circle while
  the shaft inside spins a tiny one. The difference in those two distances multiplies your twist. Say the knob of the crank
  sweeps a circle six times wider than the shaft. Then your fingers only need a sixth of the turning force the shaft delivers.


  The shaft drives the second wheel, tucked under the rim. Its edge is covered in small teeth. They bite the underside of
  the rim and drag it along, so the can walks itself through the gap. Up top, the cutting wheel simply rolls, like a pizza
  cutter riding a moving crust.


  In many openers, the two wheels are linked by little gears, so they spin in opposite directions. They pinch the rim between
  them like the rollers of an old clothes wringer, pulling the metal through instead of scraping it.


  That toothed wheel is the piece that made the modern opener possible. William Lyman of Meriden, Connecticut, had patented
  a cutting wheel in eighteen seventy. But his design needed a spike pushed through the middle of the lid, as a pivot to swing
  around. Then, in nineteen twenty-five, the Star Can Opener Company of San Francisco added the serrated feed wheel. The rim
  itself became the track. No spike, no measuring, any size of can.


  <!-- chapter: Today''s opener -->

  In nineteen thirty-one, the Bunker Clancey Company of Kansas City put the whole system into one hand: pliers-style handles
  to grip, a key to turn, and geared wheels to do the rest. Chances are, the opener in your drawer still follows that plan.


  The electric opener followed the same year, and almost nobody bought it. It only caught on in the nineteen-fifties. Inside,
  it is the same cutting wheel at work, with a motor doing the twisting for you.


  Newer designs attack from the side. Instead of slicing down through the lid, a cutting wheel and a roller split the seam
  where the lid is rolled onto the can. The edge comes away smooth, and the lid can rest back on top as a cover. It will not
  seal again, though. That is the price of a safer edge.


  <!-- chapter: Three machines, one hand -->

  So, next time a lid lifts free in your fingers, picture what just happened. Your grip was amplified by a lever. A sharp
  little disc squeezed that grip into enormous pressure. And a crank, a pair of gears and a toothed wheel marched the cut
  around the rim, one bite at a time. None of it could work until cans learned to be thin.


  Which leaves a puzzle. Some machines in your home have no crank and no gears, and barely need your hand at
  all. In the smallest room of the house, one curved pipe empties a whole bowl. And it does that by pulling the
  water out, not by pushing it.

  '
