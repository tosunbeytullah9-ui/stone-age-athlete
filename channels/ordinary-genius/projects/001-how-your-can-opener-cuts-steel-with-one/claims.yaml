claims:
- {id: c01, text: Tins carried on Parry's Arctic expeditions in the 1820s told users to cut round the top with a chisel and hammer, source: wohleber2000canopener, says: Cut around the top with a hammer and a chisel., confidence: high, caveat: 'Wording differs between sources (also tomatomuseum-canopener, wiki-canopener); paraphrased, not quoted', verified: false, shots: [s004]}
- {id: c02, text: Peter Durand patented food canning in England in 1810, source: tomatomuseum-canopener, says: The can had been patented in eighteen ten., confidence: high, caveat: Also wiki-canopener, verified: false, shots: [s005]}
- {id: c03, text: Ezra J. Warner received the first US can-opener patent on 5 January 1858, source: us19063warner, says: America's first can opener was patented in eighteen fifty-eight., confidence: high, caveat: First US patent per tomatomuseum-canopener, verified: false, shots: [s006]}
- {id: c04, text: 'Early cans were heavy wrought iron, often weighing more than their contents', source: wohleber2000canopener, says: Many of them weighed more than the food sealed inside., confidence: high, caveat: Also wiki-canopener, verified: false, shots: [s019]}
- {id: c05, text: Soldiers opened early cans with bayonets, source: wohleber2000canopener, says: Soldiers opened theirs with bayonets., confidence: high, verified: false, shots: [s020]}
- {id: c06, text: Can walls became thinner during the 1800s; dedicated openers appeared from the 1850s, source: wohleber2000canopener, says: 'can walls got thinner, and only then did real openers appear', confidence: high, caveat: 'I&T: thinner steel cans late 1850s; wiki-canopener: walls thinner during the 1800s', verified: false, shots: [s022, s023]}
- {id: c07, text: Robert Yeates patented a lever-type can opener in England in 1855, source: wiki-canopener, says: Robert Yeates patented one in England in eighteen fifty-five., confidence: high, caveat: 'tomatomuseum-canopener spells it Yates (UK patent 1,577, 13 July 1855)', verified: false, shots: [s024]}
- {id: c08, text: 'Warner of Waterbury, Connecticut patented his opener in 1858', source: us19063warner, says: 'Ezra Warner of Waterbury, Connecticut, followed three years later.', confidence: high, verified: false, shots: [s025, s026]}
- {id: c09, text: 'Warner''s opener: a piercing point, a removable curved cutter and a guard limiting the depth', source: us19063warner, says: 'a sharp point to punch the lid, a curved blade', confidence: high, caveat: 'Depth guard: wohleber2000canopener', verified: false, shots: [s027, s028]}
- {id: c10, text: Warner's opener was used by the Union Army in the Civil War, source: tomatomuseum-canopener, says: The Union Army used it during the Civil War., confidence: high, caveat: Also wiki-canopener, verified: false, shots: [s030]}
- {id: c11, text: Warner's opener was considered too dangerous for home use, source: wiki-canopener, says: it was considered too dangerous, confidence: high, caveat: Also tomatomuseum-canopener, verified: false, shots: [s031]}
- {id: c12, text: The cast-iron bull's head opener (1865) was spread with tins of 'Bully' beef, source: tomatomuseum-canopener, says: 'shaped like a bull''s head, came packed with tins', confidence: high, caveat: Also wiki-canopener, verified: false, shots: [s034, s035]}
- {id: c13, text: 'Twist keys soldered onto cans (Osterhoudt patent, 1866)', source: wiki-canopener, says: 'a little slotted key, soldered to the can', confidence: high, caveat: 'Also tomatomuseum-canopener (US patent 58,554)', verified: false, shots: [s036, s037]}
- {id: c14, text: 'The key opener is still used, especially for canned fish', source: tomatomuseum-canopener, says: Some fish tins still use that idea today., confidence: high, verified: false, shots: [s039]}
- {id: c15, text: Mechanical advantage is the ratio of output to input force, source: openstax2022-9-5, says: 'It is the force you get out, divided by the force you put in.', confidence: high, verified: false, shots: [s050]}
- {id: c16, text: 'For a lever, MA = l_i / l_o, the ratio of distances from the pivot', source: openstax2022-9-5, says: simply a ratio of two distances from the pivot, confidence: high, verified: false, shots: [s052]}
- {id: c17, text: Pressure is force divided by the area over which it is applied, source: openstax2022-11-3, says: Pressure is force divided by the area it pushes on., confidence: high, verified: false, shots: [s070]}
- {id: c18, text: The same force on the area of a needle tip breaks the skin, source: openstax2022-11-3, says: a needle breaks skin while a fingertip pressing just as hard, confidence: high, verified: false, shots: [s073, s074]}
- {id: c19, text: The ratio of force to area in a solid is called stress, source: openstax2022-5-3, says: Engineers call force spread over an area stress, confidence: high, verified: false, shots: [s081]}
- {id: c20, text: Greater forces permanently deform an object until it fractures, source: openstax2022-5-3, says: 'Push harder still, and it fractures.', confidence: high, verified: false, shots: [s085]}
- {id: c21, text: Typical tinplate strip for drawn-and-wall-ironed food cans is 0.20–0.35 mm thick, source: arcelormittal2017pack, says: between two and three and a half tenths of a millimetre, confidence: high, caveat: DWI food cans; other can types can differ, on_screen: true, verified: false, shots: [s090, s091]}
- {id: c22, text: The serrated feed wheel grips the can's edge from below the rim and turns the can, source: wiki-canopener, says: They bite the underside of the rim and drag it along, confidence: high, caveat: Also wohleber2000canopener, verified: false, shots: [s110]}
- {id: c23, text: In the geared design the cutting wheel and feed wheel are coupled by cogwheels and turn in opposite directions, source: wiki-canopener, says: the two wheels are linked by little gears, confidence: medium, caveat: Bunker 1931 design; 'many openers' is the narrator's generalisation, verified: false, shots: [s135]}
- {id: c24, text: 'William Lyman of Meriden, Connecticut patented a can opener with a circular cutting wheel in 1870', source: us105346lyman, says: had patented a cutting wheel in eighteen seventy, confidence: high, caveat: Also wohleber2000canopener, verified: false, shots: [s156]}
- {id: c25, text: Lyman's opener needed its point pushed through the lid as a pivot, source: us105346lyman, says: his design needed a spike pushed through the middle of the lid, confidence: high, caveat: 'Centre piercing and adjustment for can size: wohleber2000canopener', verified: false, shots: [s157, s158]}
- {id: c26, text: In 1925 the Star Can Opener Company of San Francisco added a serrated feed wheel, source: wohleber2000canopener, says: the Star Can Opener Company of San Francisco added the serrated feed wheel, confidence: high, caveat: Also wiki-canopener, verified: false, shots: [s161, s162]}
- {id: c27, text: 'In 1931 the Bunker Clancey Company of Kansas City patented a can-holding opener with pliers handles, a turning key and geared wheels', source: wiki-canopener, says: the Bunker Clancey Company of Kansas City put the whole system, confidence: medium, caveat: Single encyclopedia source; spelling Clancey/Clancy varies, verified: false, shots: [s166, s167]}
- {id: c28, text: Electric can openers appeared in 1931 and sold poorly, source: wiki-canopener, says: 'The electric opener followed the same year, and almost nobody bought it.', confidence: high, caveat: 'tomatomuseum-canopener: Preston C. West patent, 1 Dec 1931, limited adoption', verified: false, shots: [s171, s172]}
- {id: c29, text: Electric openers returned successfully in 1956, source: wiki-canopener, says: It only caught on in the nineteen-fifties., confidence: high, caveat: Also tomatomuseum-canopener, verified: false, shots: [s173]}
- {id: c30, text: The first electric opener was based on the cutting-wheel principle, source: tomatomuseum-canopener, says: the same cutting wheel at work, confidence: medium, verified: false, shots: [s174]}
- {id: c31, text: 'Side-cutting openers use a roller and a cutting wheel on the outside seam, leaving a smooth edge', source: wiki-canopener, says: a cutting wheel and a roller split the seam, confidence: high, verified: false, shots: [s178]}
- {id: c32, text: The lid of a side-cut can can be put back as a cover but does not seal, source: wiki-canopener, says: 'It will not seal again, though.', confidence: high, verified: false, shots: [s182]}
- {id: c33, text: 'The double seam is the closure formed by interlocking and compressing the curl of the can end and the flange of the can body', source: fda-bam22d, says: 'the curled edge of the lid and the flange', confidence: high, verified: false, shots: [s116, s117]}
- {id: c34, text: 'The double seam is commonly produced in 2 operations: the first roll preforms the metal into the 5 thicknesses or folds, the second presses them flat', source: fda-bam22d, says: 'folding the metal into five thicknesses', confidence: high, verified: false, shots: [s119, s120]}
- {id: c35, text: 'A rubber-based sealing compound placed in the curl of the can end helps produce a hermetic seal by filling voids in the double seam', source: fda-bam22d, says: 'A rubbery compound tucked into the fold fills the gaps', confidence: high, verified: false, shots: [s121, s122]}
