prep:
  imported: '2026-10-21'
  file: ''
  research:
    question: How does an ordinary can opener cut steel with one hand, and why did it arrive decades after the can?
    answer: A modern rotary opener combines a lever (the handles clamp the wheels onto the rim), a wedge-edged cutting
      wheel that concentrates force into very high pressure on thin tinplate, and a crank (a lever turning round)
      that drives a serrated feed wheel under the rim so the can turns itself through the cutter. Early cans were
      heavy wrought iron and were opened with tools at hand; dedicated openers appeared from 1855 (Yeates) and 1858
      (Warner), Lyman's wheel came in 1870 but needed a centre pivot, the 1925 Star feed wheel made the rim the
      track, and Bunker's 1931 design is the layout most hand openers still use.
    angle: 'Most can-opener content is either trivia (''cans came first'') or usage tips; this video explains the
      physics of all three simple machines inside it with exact animated diagrams, and ties the history to the physics:
      the tool could only work once the can got thin.'
    competition: 'Not measured yet from YouTube in this session (youtube.com blocked here). Run: tools/yt_tara.py
      konular --channel ordinary-genius --only g001. Web: ''you are using your can opener wrong'' tips and ''cans
      came 48 years before the opener'' trivia are common.'
    open_questions: [Check the top YouTube videos for 'how does a can opener work' with yt_tara and sharpen the
        angle if one already explains the pressure and feed-wheel physics in depth., Bunker Clancey (1931) rests
        on one encyclopedia source; a patent number would make it firm.]
  policy:
