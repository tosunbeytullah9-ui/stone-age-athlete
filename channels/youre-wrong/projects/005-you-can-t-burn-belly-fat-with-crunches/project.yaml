title: You Can't Burn Belly Fat With Crunches
idea: i005
status: production
description: Crunches don't burn belly fat. From tennis players' arms to 5,004 sit-ups, one-legged leg presses and
  a meta-analysis of 1,158 people, spot reduction keeps failing. Here's how fat actually leaves your body, and what
  to do instead. Case file 005.
