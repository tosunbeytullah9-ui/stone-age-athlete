- {id: c05, text: 'Katch 1984: 19 subjects; sit-up group did 5,004 sit-ups over 27 days; fat cell size fell similarly at abdominal, subscapular and gluteal sites.', source: katch1984, shots: [s058, s059, s060, s061, s062, s063, s064, s065, s066, s067, s068, s069], confidence: high, verified: false}
