# Claims in this video → shared library (library/sources.yaml). Set verified: true after you have
# checked the quote against the source yourself. Panel: 1 · Senaryo & kaynaklar → İddialar.
claims:
- {id: c01, text: 'Stretching of all kinds acutely increases range of motion, typically for under 30 minutes.', source: behm2016, shots: [s024, s025, s026, s027, s028], confidence: high, verified: false}
- {id: c02, text: Bob and Jean Anderson self-published 'Stretching' in 1975; it sold over 3.5 million copies with 29 foreign editions., source: gazette2020stretching, shots: [s035, s036, s037, s038, s039], confidence: high, verified: false}
- {id: c03, text: 'Pope 2000: 1,538 male army recruits randomised; one 20-s static stretch for six leg muscle groups each warm-up; 12 weeks; 333 lower-limb injuries (158 stretch vs 175 control); HR 0.95, not significant.', source: pope2000, shots: [s053, s054, s055, s056, s057, s058, s059, s060, s061, s062, s063, s064, s065, s066, s067, s068, s069, s070, s071, s072, s073, s074, s075], confidence: high, verified: false}
- {id: c04, text: Pope 2000 authors suggested fitness may be a modifiable injury risk factor., source: pope2000, shots: [s076, s077], confidence: high, verified: false}
- {id: c05, text: 'Lauersen 2014: 25 RCTs, 26,610 participants, 3,464 injuries; stretching RR 0.963 (no effect); strength training RR 0.315; proprioception RR 0.55; overuse injuries almost halved.', source: lauersen2014, shots: [s079, s080, s081, s082, s083, s084, s085, s086, s087, s088, s089, s090, s091, s092, s093, s094, s095, s096, s097], confidence: high, verified: false}
- {id: c06, text: 'van Dyk 2019: 15 studies, 8,459 athletes; programmes including the Nordic hamstring exercise reduced hamstring injuries by up to 51%.', source: vandyk2019, shots: [s102, s103, s104, s105, s106, s107, s108, s109], confidence: high, verified: false}
- {id: c07, text: 'Simic 2013: 104 studies; static stretching reduced maximal strength by 5.4% and explosive performance by 2.0%; smaller effects with shorter stretches.', source: simic2013, shots: [s113, s114, s115, s116, s117, s118, s119, s120, s121, s122, s123, s124], confidence: high, verified: false}
- {id: c08, text: 'Behm 2016: static stretches under 60 s per muscle group had a small effect (-1.1%); dynamic stretching improved performance (+1.3%); recommended stretching followed by dynamic activity.', source: behm2016, shots: [s125, s126, s127, s128, s129, s130, s131, s132, s133], confidence: high, verified: false}
- {id: c09, text: 'Cochrane 2011: 12 studies; stretching before/after exercise reduced soreness ~1 point on a 100-point scale; the large trial (~2,377 people) showed 3.8 points; not clinically important.', source: herbert2011cochrane, shots: [s145, s146, s147, s148, s149, s150, s151, s152, s153, s154, s155, s156, s157, s158, s159, s160, s161, s162], confidence: high, verified: false}
- {id: c10, text: Acute increases in range of motion may reflect improved stretch tolerance rather than structural change., source: behm2016, shots: [s169, s170, s171], confidence: high, verified: false}
- {id: c11, text: 'Soligard 2008: 1,892 female footballers aged 13-17; ~20-minute warm-up (running, strength, balance, plyometrics); overall injuries RR 0.68, severe injuries RR 0.55.', source: soligard2008, shots: [s191, s192, s193, s194, s195, s196, s197, s198, s199, s200], confidence: high, verified: false}
