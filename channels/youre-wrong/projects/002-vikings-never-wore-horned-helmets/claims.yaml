claims:
- {id: c01, text: Carl Emil Doepler designed horned helmets in 1875 for the first complete Bayreuth production of Wagner's Ring (premiered 1876), source: frank2000horned, shots: [s004, s005, s006, s109, s110, s111, s112, s113, s114, s115, s116, s117, s124, s125, s204, s205], confidence: high, on_screen: true, verified: true}
- {id: c02, text: 'The Gjermundbu helmet was found in March 1943 while a man levelled ground for a house; it came from a 10th-century grave, was restored from nine fragments, is made of four iron plates and has no horns', source: gjermundbu-wiki, shots: [s019, s020, s021, s022, s023, s024, s029, s030, s031, s032, s033, s034, s035, s036], confidence: high, verified: true}
- {id: c03, text: The Gjermundbu grave also held the most complete Viking Age mail shirt known, source: hurstwic-mail, shots: [s025, s026], confidence: medium, caveat: Described as 'more or less complete', verified: true}
- {id: c04, text: 'The Yarm helmet, dug up by workers laying sewage pipes in the 1950s, was dated to the 10th century in a 2020 Durham University study; it is the second nearly complete Viking helmet known', source: smithsonian2020yarm, shots: [s037, s038, s039, s040, s041, s042, s043, s044, s045, s046, s047, s048, s049], confidence: high, verified: true}
- {id: c05, text: About five Viking helmets (mostly fragments) are known; only two could be reconstructed, source: gjermundbu-wiki, shots: [s050, s051, s052, s053], confidence: medium, verified: true}
- {id: c06, text: 'Metal helmets were expensive and uncommon, repaired and passed down; many Vikings probably fought without one', source: hurstwic-helmets, shots: [s057, s058, s059, s060, s061, s062, s063], confidence: medium, caveat: '''Probably'' kept in the script', verified: true}
- {id: c07, text: 'In Old Norse a víkingr was a person on an expedition (usually by sea, in a group) and víking the activity; not an ethnic name', source: jesch-viking, shots: [s064, s065, s066, s067, s068, s069], confidence: high, verified: true}
- {id: c08, text: The raid on Lindisfarne in 793 is often cited as the beginning of the Viking Age, source: britannica-lindisfarne, shots: [s075, s076, s077, s078, s079], confidence: high, verified: true}
- {id: c09, text: 'Wood cut with metal tools at L''Anse aux Meadows, Newfoundland, was dated to 1021 using the 993 solar-storm signal in tree rings (2021 study)', source: kuitems2021, shots: [s080, s081, s082, s083, s084, s085, s086, s087], confidence: high, on_screen: true, verified: true}
- {id: c10, text: Before the late 1870s artists usually gave Vikings winged helmets; in Tegnér's Frithiof's Saga (1825) the hero wears an 'eagle's helm', source: frank2000horned, shots: [s100, s101, s102, s103, s104, s105, s106, s107, s108], confidence: high, verified: true}
- {id: c11, text: Cosima Wagner said the costumes made the characters look like Native American chiefs, source: frank2000horned, shots: [s118, s119, s120, s121], confidence: high, caveat: Frank quotes her word 'Indianerhäuptlinge', verified: true}
- {id: c12, text: A British adventure novel (Ballantyne's Erling the Bold) showed winged hats in eight illustrated editions and horns from the ninth (1890), source: frank2000horned, shots: [s126, s127, s128, s129], confidence: high, on_screen: true, verified: true}
- {id: c13, text: Roberta Frank found almost no horned Vikings in pictures before the late 1870s (one exception from 1851), source: frank2000horned, shots: [s132, s133, s134, s135], confidence: high, verified: true}
- {id: c14, text: 'In 1942 a peat worker found two bronze helmets with horns, a beak and eyes in a bog at Veksø, Denmark', source: popsci2022vekso, shots: [s146, s147, s148, s149, s150, s151, s152], confidence: high, verified: true}
- {id: c15, text: 'A 2022 study dated the Veksø helmets to around 900 BC, nearly two millennia before the Viking Age; an archaeologist called the Viking link ''nonsense''', source: vice2022vekso, shots: [s013, s014, s015, s153, s154, s155, s156, s157, s158, s159, s202, s203], confidence: high, caveat: Glue dated to about 950 BC (Popular Science); deposition about 900 BC, on_screen: true, verified: true}
- {id: c16, text: 'The Veksø helmets were probably ceremonial, not battle gear', source: popsci2022vekso, shots: [s160, s161, s162, s163, s164, s165], confidence: medium, caveat: '''I was there'' is the narrator''s fiction', verified: true}
- {id: c17, text: The Oseberg tapestry depicts horned headgear; the only preserved Viking Age helmet has no horns; no contemporary source mentions Vikings wearing horned headgear, source: natmus-helmets, shots: [s166, s167, s168, s169, s170, s171, s172, s173, s174, s175], confidence: high, verified: true}
- {id: c18, text: '19th-century writers cited ancient horned figures (the Gallehus golden horn, Grevensvaenge bronze figures, the Torslunda dancer plate) as justification', source: frank2000horned, shots: [s176, s177, s178, s179, s180, s181], confidence: high, verified: true}
- {id: c19, text: 'Combs appear in male and female Viking graves alongside tweezers, ear scoops and toothpicks; the Old Norse word for Saturday means ''bath day''', source: worldtree-hygiene, shots: [s187, s188, s189, s190, s191, s192], confidence: medium, verified: true}
- {id: c20, text: 'An English chronicle (attributed to John of Wallingford) said the Danes combed their hair daily, bathed on Saturdays and changed clothes regularly', source: worldtree-hygiene, shots: [s193, s194, s195, s196], confidence: medium, caveat: Written long after the events; attribution debated, verified: true}
- {id: c21, text: 'Frank links the horned helmet to the stage and to late-19th-century nationalism, not to archaeology', source: frank2000horned, shots: [s224, s225, s226, s227], confidence: high, verified: true}
