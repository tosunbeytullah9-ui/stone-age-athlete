title: Vikings Never Wore Horned Helmets. An Opera Did.
idea: i002
status: production
description: Picture a Viking and you see horns. Those horns were designed in 1875 by a costume designer for Wagner's
  Ring. The real Viking helmets we have are round, iron and hornless; the real horned helmets are Bronze Age and
  about 1,700 years too early. Case file 002.
chapters: {0: The helmet in your head, 4: The only real Viking helmets, 9: What 'Viking' actually meant, 13: 'Who
    gave them horns?', 15: '1875: the opera', 19: Real horned helmets, 24: 'Were Vikings dirty?', 27: Verdict, 28: How
    to spot a costume}
publish:
  title_variants: [Vikings Never Wore Horns. An Opera Did., 'Who Actually Put Horns on Viking Helmets?', The Opera
      Costume That Fooled the World, Why Vikings Never Wore Horned Helmets, Vikings Didn't Wear Horns. He Did.,
    The 1876 Mistake on Every Viking Helmet, We Only Found 2 Viking Helmets. Neither Has Horns., 'Did Any Viking
      Ever Actually Wear Horns?', How Wagner's Costume Designer Fooled History, 'Vikings: The Real Helmet vs The
      Opera Myth']
  hook_options:
  - {type: cold_open_stat, text: 'We have dug up thousands of Viking graves, but only two complete helmets. Neither
      of them has horns. Not even a small one.'}
  - {type: contradiction, text: Horned helmets are entirely real. Archaeologists found them in Denmark. But they
      were made seventeen hundred years before the first Viking.}
  - {type: mystery, text: Those horns on every Viking helmet weren't made of iron or bone. They were designed in
      1875 by a costume designer for an opera.}
