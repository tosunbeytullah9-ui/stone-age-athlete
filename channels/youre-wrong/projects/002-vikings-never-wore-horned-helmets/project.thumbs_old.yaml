      From 1875]
  hook_options:
  - {type: you, text: 'Picture a Viking. Big beard, big axe, two big horns. Those horns were designed in 1875 by
      a costume designer for an opera.'}
  - {type: cold_open_stat, text: Only two nearly complete Viking helmets have ever been found. Neither has horns.}
  - {type: mystery, text: 'Horned helmets are real. Archaeologists have dug them up. They are just 1,700 years too
      old to be Viking.'}
