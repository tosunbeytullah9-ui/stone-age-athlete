# Claims in this video → shared library (library/sources.yaml). Set verified: true after you have
# checked the quote against the source yourself. Panel: 1 · Senaryo & kaynaklar → İddialar.
claims:
- {id: c01, text: 'Antommarchi, assisted by Marchand, measured Napoleon''s body at 5 pieds 2 pouces 4 lignes.', source: dunan1963taille, shots: [s024, s025, s026, s043, s044], confidence: high, caveat: 'Also supported by: history-napoleon-short', verified: false}
- {id: c02, text: A French pouce was about 2.7 cm; an English inch is 2.54 cm., source: dunan1963taille, shots: [s037, s038, s039], confidence: high, caveat: 'Also supported by: history-napoleon-short', verified: false}
- {id: c03, text: '5 pieds 2 pouces 4 lignes converts to about 1.686 m, roughly 5 ft 6 in English.', source: dunan1963taille, shots: [s045, s046, s047], confidence: high, caveat: 'Also supported by: history-napoleon-short', verified: false}
- {id: c04, text: Englishman Andrew Darling measured the body at 5 ft 7 in English (about 1.70 m)., source: dunan1963taille, shots: [s049, s050, s051, s052, s053], confidence: high, verified: false}
- {id: c05, text: In 1802 John Leslie Foster described the First Consul as about 5 ft 7 in., source: dunan1963taille, shots: [s056, s057, s058], confidence: high, verified: false}
- {id: c06, text: A 1963 article in the Revue de l'Institut Napoléon misprinted 1.64 m; the next issue corrected it to 1.68 m., source: dunan1963taille, shots: [s061, s062, s063, s064, s065], confidence: high, verified: false}
- {id: c07, text: 'At about 1.67-1.70 m Napoleon was roughly average, slightly above average for a Frenchman of his time.', source: history-napoleon-short, shots: [s070, s071, s072, s073, s207, s208, s209], confidence: high, caveat: 'Also supported by: wiki-napoleon-complex', verified: false}
- {id: c08, text: Old Guard grenadiers had to be at least 5 ft 10 in (1.78 m)., source: wiki-old-guard, shots: [s089, s090], confidence: high, verified: false}
- {id: c09, text: 'His plain chasseur colonel''s uniform among plumed, ornately dressed officers and bearskin-wearing grenadiers made him look small.', source: dunan1963taille, shots: [s092, s093, s094], confidence: high, caveat: 'Also supported by: historyhit-gillray', verified: false}
- {id: c10, text: The legend that the 'petit caporal' nickname arose at Lodi (10 May 1796) has no contemporary evidence., source: wiki-lodi, shots: [s106, s107, s108, s109, s110, s111], confidence: high, verified: false}
- {id: c11, text: Gillray's prints drew crowds at Hannah Humphrey's shop; Pitt's government paid him from 1797; he never saw Napoleon., source: historyhit-gillray, shots: [s116, s117, s118, s119, s120, s121, s122], confidence: high, verified: false}
- {id: c12, text: After the Peace of Amiens collapsed (1803) Gillray popularised 'Little Boney'., source: historyhit-gillray, shots: [s123, s124, s125, s126, s127, s128, s129], confidence: high, caveat: 'Also supported by: history-napoleon-short, dunan1963taille', verified: false}
- {id: c13, text: 'In March 1803 Napoleon berated ambassador Lord Whitworth; British papers reported an invasion threat of 400,000-500,000 men.', source: historyhit-gillray, shots: [s131, s132, s133, s134, s135], confidence: high, caveat: 'Also supported by: history-napoleon-short', verified: false}
- {id: c14, text: Gillray's 'The King of Brobdingnag and Gulliver' (26 June 1803) shows George III examining a tiny Napoleon through a spyglass., source: napoleonguide-brobdingnag, shots: [s141, s142, s143, s144, s145], confidence: high, caveat: 'Also supported by: dunan1963taille', verified: false}
- {id: c15, text: '''The Plumb-pudding in Danger'' (1805) shows Napoleon at half Pitt''s size; often called the most famous political cartoon.', source: history-napoleon-short, shots: [s146, s147, s148, s149, s150, s151, s152], confidence: high, caveat: 'Also supported by: historyhit-gillray', verified: false}
- {id: c16, text: George Cruikshank's 'Snuffing Out Boney!' (1814) shows a miniature Napoleon snuffed out by a Cossack., source: harvard-snuffing-boney, shots: [s154, s155, s156], confidence: high, verified: false}
- {id: c17, text: 'Napoleon reportedly said Gillray did more than all the armies of Europe to bring him down, and in 1806 demanded British press censorship.', source: history-napoleon-short, shots: [s158, s159, s160, s161, s162], confidence: high, verified: false}
- {id: c18, text: 'David (1801-1805) painted Bonaparte ''calm, mounted on a fiery steed''; Napoleon refused to sit, David used a bust and his son.', source: wiki-crossing-alps, shots: [s165, s166, s167, s168, s169, s170], confidence: high, verified: false}
- {id: c19, text: Delaroche's 1850 painting shows Napoleon crossing the Alps on a mule., source: wiki-crossing-alps, shots: [s171, s172, s173], confidence: high, verified: false}
- {id: c20, text: A 2007 University of Central Lancashire study found taller men more likely than short men to lose their temper and retaliate., source: wiki-napoleon-complex, shots: [s186, s187, s188, s189, s190, s191, s192, s201, s202, s203, s204, s205], confidence: high, caveat: 'Also supported by: bbc2007shortmen', verified: false}
- {id: c21, text: 'Knapen et al. (2018): shorter men kept more in a dictator game against taller men but were not more physically aggressive.', source: knapen2018, shots: [s193, s194, s195, s196, s197, s198], confidence: high, caveat: 'Also supported by: wiki-napoleon-complex', verified: false}
