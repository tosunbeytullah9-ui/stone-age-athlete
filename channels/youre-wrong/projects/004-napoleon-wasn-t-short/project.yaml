  title_variants: [Napoleon Wasn't Short, Napoleon Wasn't Short. A Cartoonist Made Him Small, The Napoleon Complex
      Is Built on a Mistake, How Britain Shrank an Emperor by 10 cm]
  hook_options:
  - {type: you, text: 'He conquered half of Europe, and all you remember is his height. The height he never had.'}
  - {type: cold_open_stat, text: Five foot two. That's what they wrote down. They just weren't your feet.}
  - {type: contradiction, text: The most famous short man in history was average. Here's who shrank him.}
