title: Napoleon Wasn't Short
idea: i004
status: production
description: Napoleon was measured at 5 feet 2 inches. In French inches. Converted properly he was about 1.68-1.70
  m, roughly average for his time. So who shrank him? A unit conversion, a bodyguard of giants in bearskin hats,
  and a British cartoonist who never met him. Case file 004.
chapters: {0: Intro, 4: The body on Saint Helena, 7: French inches, 12: Average for his time, 13: Three suspects,
  15: The bodyguard, 17: The little corporal, 19: The cartoonist, 27: Napoleon's own propaganda, 29: The Napoleon
    complex, 34: Verdict}
