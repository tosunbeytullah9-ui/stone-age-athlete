claims:
- {id: c01, text: 'In 1907 Fletcher and Hopkins showed that muscle working without oxygen produces lactic acid, and that oxygen removes it', source: sportsci-hopkins, shots: [s016, s017, s018, s019, s020, s021, s022, s023], confidence: high, on_screen: true, verified: false}
- {id: c02, text: Hopkins later won a Nobel Prize for other work; Hill credited the 1907 experiment with starting modern muscle chemistry, source: sportsci-hopkins, shots: [s024, s025, s026, s027], confidence: medium, caveat: Hopkins' Nobel (1929) was for vitamins, verified: false}
- {id: c03, text: A. V. Hill shared the 1922 Nobel Prize with Otto Meyerhof; he described an 'oxygen debt' in which about one-fifth of the lactic acid is oxidised and the rest rebuilt into glycogen, source: sportsci-hill, shots: [s031, s032, s033, s034, s035, s036, s037, s038, s039, s040, s041, s042, s043], confidence: high, verified: false}
- {id: c04, text: Lactate was long viewed as a waste product and cause of fatigue, source: brooks2018berkeley, shots: [s046, s047, s048, s049, s050, s051, s052, s053], confidence: high, verified: false}
- {id: c05, text: Blood lactate returns to pre-exercise levels within about one hour after exercise, source: sonkodi2022, shots: [s056, s057, s058, s059, s060, s178], confidence: medium, on_screen: true, verified: false}
- {id: c06, text: Delayed soreness becomes evident about 6-8 hours after intense exercise and peaks around 48 hours, source: schoenfeld2013doms, shots: [s061, s062, s063, s064, s065, s066, s067, s179], confidence: high, on_screen: true, verified: false}
- {id: c07, text: 'In 1983 Schwane and colleagues found lactate rose with level running but not downhill running, yet downhill running causes soreness', source: schwane1983, shots: [s072, s073, s074, s075, s076, s077, s078, s079, s180, s181], confidence: high, caveat: Details via Sonkodi 2022; check the original, verified: false}
- {id: c08, text: 'Lengthening (eccentric) muscle work, as in downhill running, is most associated with delayed soreness', source: schoenfeld2013doms, shots: [s080, s081, s082, s083, s084, s085, s086, s087, s088, s089], confidence: medium, caveat: Check wording in the review, verified: false}
- {id: c09, text: 'Cells produce lactate, not lactic acid; lactate production opposes rather than causes acidosis', source: robergs-conversation, shots: [s090, s091, s092, s093, s094, s095], confidence: high, verified: false}
- {id: c10, text: 'Brooks'' lactate shuttle: lactate moves between cells; the heart and brain run more efficiently on lactate than glucose; muscle mitochondria burn it during intense activity', source: brooks2018berkeley, shots: [s096, s097, s098, s099, s100, s101, s102, s103, s104, s105, s182, s183], confidence: high, verified: false}
- {id: c11, text: Brooks describes lactate production as a strain response that compensates for metabolic stress, source: brooks2018berkeley, quote: 'lactate production is a strain response, it''s there to compensate for metabolic stress', shots: [s106, s107, s108, s109, s110, s111], confidence: high, verified: false}
- {id: c12, text: Delayed soreness comes from small-scale muscle damage after unaccustomed exercise and the repair response over the next day or two, source: robergs-conversation, shots: [s124, s125, s126, s127, s128, s129, s130, s131, s132, s133], confidence: high, verified: false}
- {id: c13, text: Repeating the same activity within about two weeks greatly reduces damage and soreness (repeated bout effect), source: robergs-conversation, shots: [s132, s133, s134, s135, s136, s137, s138], confidence: medium, caveat: 'Chart values are illustrative, not measured', verified: false}
- {id: c14, text: 'In 10 volunteers, lactate, protons or ATP alone caused no sensation; combined at exercise levels they produced fatigue and, at higher levels, ache', source: pollak2014, shots: [s147, s148, s149, s150, s151, s152, s153, s154, s155, s156, s157, s158, s159, s160], confidence: medium, caveat: Small study; thumb muscle, verified: false}
- {id: c15, text: One researcher argues lactate's role in delayed soreness should be reconsidered via nerves (hypothesis), source: sonkodi2022, shots: [s161, s162, s163, s164], confidence: low, caveat: Presented as a hypothesis in the script, verified: false}
- {id: c16, text: Soreness is not a valid gauge of training results, source: schoenfeld2013doms, quote: it therefore should not be used as a definitive gauge of results, shots: [s168, s169, s170, s171, s172, s173, s174, s175, s191, s192, s193, s194, s195, s196], confidence: high, verified: false}
- {id: c17, text: 'A 2018 meta-analysis of 99 studies found massage most effective for soreness and perceived fatigue; active recovery, compression, immersion and contrast water had smaller effects; stretching had none', source: dupuy2018, shots: [s207, s208, s209, s210, s211, s212], confidence: high, on_screen: true, verified: false}
- {id: c18, text: Delayed soreness typically subsides within about 7 days, source: sonkodi2022, shots: [s216, s217, s218], confidence: medium, verified: false}
