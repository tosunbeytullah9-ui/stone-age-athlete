title: Columbus Didn't Prove the Earth Was Round
idea: i008
status: production
description: In 1492 nobody educated thought the Earth was flat. The real argument was about its size, and Columbus
  got it wrong. Eratosthenes, a medieval textbook called The Sphere, a pear-shaped Earth and the 1828 biography
  that invented the myth. Case file 008.
chapters: {0: Intro, 4: The Greeks measured it, 9: The Middle Ages knew, 14: 'The real argument: size', 18: Columbus's
    maths, 21: His critics were right, 23: A pear-shaped Earth, 26: Where the myth came from, 32: Verdict}
