claims:
- {id: c01, text: Greek philosophers documented a spherical Earth by the 5th century BC., source: wiki-flat-earth-myth, shots: [s021, s022], confidence: high, verified: false}
- {id: c02, text: 'Eratosthenes measured a 7.2-degree (1/50 circle) shadow angle at Alexandria vs Syene, ~5,000 stadia apart, giving ~250,000 stadia; close to the real ~40,000 km depending on stade length.', source: wiki-eratosthenes, shots: [s031, s032, s033, s034, s035, s036, s037, s038, s039, s040, s041, s042, s043, s044, s045, s046, s047, s048, s049, s050], confidence: high, verified: false}
- {id: c03, text: 'Sacrobosco''s De sphaera (c. 1230) describes a spherical Earth, was a university textbook for centuries, and had 85+ printed editions.', source: wiki-de-sphaera, shots: [s057, s058, s059, s060, s061, s062, s063, s064, s065, s066], confidence: high, verified: false}
- {id: c04, text: Lactantius (c. 310) and Cosmas Indicopleustes (c. 548) were rare flat-Earth exceptions; Copernicus ridiculed Lactantius in 1543., source: wiki-flat-earth-myth, shots: [s077, s078, s079, s080, s081, s082, s083, s084, s085], confidence: high, verified: false}
- {id: c05, text: 'Stephen Jay Gould: ''there never was a period of flat Earth darkness among scholars''.', source: wiki-flat-earth-myth, shots: [s086, s087], confidence: high, verified: false}
- {id: c06, text: 'The 1490s debate was about Earth''s size and the distance to Asia, not its shape.', source: wiki-flat-earth-myth, shots: [s093, s094], confidence: high, caveat: 'Also supported by: wiki-columbus', verified: false}
- {id: c07, text: In 1474 Toscanelli suggested to Afonso V of Portugal sailing west to Asia; the king rejected it; Columbus reportedly corresponded with Toscanelli in 1481., source: wiki-columbus, shots: [s101, s102, s103, s104, s105, s106], confidence: high, verified: false}
- {id: c08, text: 'Columbus misread Alfraganus'' Arabic miles as shorter Roman miles and preferred Ptolemy''s smaller figures, underestimating Earth''s size.', source: wiki-columbus, shots: [s108, s109, s110, s111, s112, s113, s114, s115, s116], confidence: high, verified: false}
- {id: c09, text: 'Columbus estimated 2,400 nmi from the Canaries to Japan; the actual distance is 10,600 nmi.', source: wiki-columbus, shots: [s118, s119, s120, s121, s122, s123], confidence: high, verified: false}
- {id: c10, text: 'John II''s Portuguese advisers and Talavera''s Castilian commission rejected the plan, judging the distance far greater than Columbus claimed.', source: wiki-columbus, shots: [s126, s127, s128, s129, s130, s131, s132, s133, s134], confidence: high, verified: false}
- {id: c11, text: 'On his third voyage (1498) Columbus wrote the Earth was shaped like a pear, very round except where the stalk grows.', source: columbus1498-third-voyage, shots: [s146, s147, s148, s149, s150], confidence: high, verified: false}
- {id: c12, text: 'Martin Behaim''s Erdapfel (Nuremberg, 1490-1492) is the oldest surviving terrestrial globe and lacks the Americas.', source: wiki-erdapfel, shots: [s155, s156, s157, s158, s159, s160, s161, s162], confidence: high, verified: false}
- {id: c13, text: Magellan's expedition left in 1519 with five ships and about 270 men; Victoria returned in 1522 with 18., source: wiki-magellan-expedition, shots: [s165, s166, s167, s168, s169, s170], confidence: high, verified: false}
- {id: c14, text: Washington Irving's 1828 biography of Columbus was romanticised; its Salamanca council scene is largely fictional., source: wiki-flat-earth-myth, shots: [s175, s176, s177, s178, s179, s180, s181, s182, s183, s184, s185], confidence: high, verified: false}
- {id: c15, text: Draper (1874) and White (1896) promoted the flat-Earth myth in conflict-thesis histories; Russell's 'Inventing the Flat Earth' (1991) debunked it., source: wiki-flat-earth-myth, shots: [s192, s193, s194, s195, s196, s197, s198, s199, s200, s201, s202, s203, s204, s205, s206, s207], confidence: high, verified: false}
