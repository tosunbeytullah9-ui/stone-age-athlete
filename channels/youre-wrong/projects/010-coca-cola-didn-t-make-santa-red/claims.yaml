claims:
- {id: c01, text: 'Saint Nicholas, a 4th-century bishop, is usually depicted in continental Europe as a bearded bishop in canonical robes.', source: wiki-santa-claus, shots: [s020, s021, s022, s023, s024, s025], confidence: high, verified: false}
- {id: c02, text: '''A Visit from St. Nicholas'' (1823) describes him as ''chubby and plump, a right jolly old elf'' with a miniature sleigh and tiny reindeer; reindeer Dunder and Blixem later became Donner and Blitzen.', source: wiki-santa-claus, shots: [s028, s029, s030, s031, s032, s033, s034, s035, s036, s037, s038, s039, s040, s041, s042, s043, s044, s045], confidence: high, caveat: 'Also supported by: smithsonian2018nast', verified: false}
- {id: c03, text: 'Nast''s first Santa (Harper''s Weekly, 3 January 1863) visits a Union camp in a stars-and-stripes outfit holding a Jefferson Davis-like puppet; he drew 33 Santa illustrations through 1886.', source: smithsonian2018nast, shots: [s054, s055, s056, s057, s058, s059, s060, s061, s062, s063, s064], confidence: high, verified: false}
- {id: c04, text: 'Nast''s 1866 ''Santa Claus and His Works'' gave Santa a workshop and the address ''Santa Claussville, N.P.''', source: wiki-santa-claus, shots: [s065, s066], confidence: high, verified: false}
- {id: c05, text: Nast's 1881 'Merry Old Santa Claus' shows Santa in his characteristic red suit., source: smithsonian2018nast, shots: [s067, s068, s069, s070], confidence: high, verified: false}
- {id: c06, text: 'Puck magazine covers of 1902, 1904 and 1905 show Santa in red and white essentially in his current form.', source: wiki-santa-claus, shots: [s078, s079, s080, s081, s082, s083, s084], confidence: high, verified: false}
- {id: c07, text: A 1927 New York Times piece reported 'A standardized Santa Claus appears to New York children'., source: snopes2008santa, shots: [s085, s086, s087, s088, s089], confidence: high, verified: false}
- {id: c08, text: 'White Rock used Santa to sell mineral water in 1915 and ginger ale (in colour) from 1923, predating Coca-Cola; Pepsi used similar Santa paintings in the 1940s-50s.', source: wiki-white-rock, shots: [s091, s092, s093, s094, s095, s096, s097, s098, s099, s100], confidence: high, caveat: 'Also supported by: wiki-santa-claus', verified: false}
- {id: c09, text: 'Early Father Christmas costumes were brown, green, blue or white, though red was most common; an 1854 story describes a long brown robe; an 1881 poem mentions him ''robed in green''.', source: wiki-father-christmas, shots: [s110, s111, s112, s113, s114, s115, s116, s117, s118, s119, s120], confidence: high, verified: false}
- {id: c10, text: John Leech's illustration of the Ghost of Christmas Present in A Christmas Carol (1843) shows a loose green fur-trimmed gown; Dickens does not name him Father Christmas., source: wiki-father-christmas, shots: [s121, s122, s123, s124, s125, s126, s127, s128, s129, s130], confidence: high, verified: false}
- {id: c11, text: Father Christmas and Santa merged; a 1915 report spoke of a 'happy compromise'; in 1985 the Illustrated London News noted Britons kept the older long-robed image., source: wiki-father-christmas, shots: [s131, s132, s133, s134, s135, s136, s137, s138, s139, s140, s141, s142, s143], confidence: high, verified: false}
- {id: c12, text: In Brazil a green-clothed Santa became popular through Dolly soft drink commercials in the 2000s., source: wiki-santa-claus, shots: [s147, s148, s149, s150], confidence: high, verified: false}
- {id: c13, text: 'Coca-Cola hired Haddon Sundblom in 1931; inspired by Moore''s poem he painted a warm, friendly, pleasantly plump, human Santa for 33 years (to 1964); his first model was Lou Prentice.', source: wiki-sundblom, shots: [s156, s157, s158, s159, s160, s161, s162, s163, s164, s165, s166, s167, s168], confidence: high, caveat: 'Also supported by: snopes2008santa', verified: false}
- {id: c14, text: Coca-Cola did not invent Santa's image but its Sundblom ads helped popularise and standardise the modern version., source: qz2012santa, shots: [s172, s173, s174, s175, s176, s177, s178], confidence: high, caveat: 'Also supported by: snopes2008santa', verified: false}
