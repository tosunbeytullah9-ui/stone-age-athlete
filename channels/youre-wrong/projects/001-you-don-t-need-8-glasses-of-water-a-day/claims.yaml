claims:
- {id: c01, text: 'The popular rule is "8 x 8": eight 8-ounce glasses of water a day (about 1.9 L)', source: dartmouth2002water, quote: 'commonly known as "8 x 8" (for eight, eight-ounce glasses)', shots: [s001, s006, s139, s147, s173], confidence: high, verified: true}
- {id: c02, text: 'In 1945 the US Food and Nutrition Board recommended about 2.5 L of water a day for adults, roughly 1 mL per calorie of food', source: dartmouth2002water, quote: '"1 milliliter of water for each calorie of food"', shots: [s019, s020, s021, s022, s023, s024, s025], confidence: high, caveat: '''About ten glasses'' is 2.5 L / 0.24 L, simple arithmetic', verified: true}
- {id: c03, text: 'The next sentence of the 1945 recommendation said: "Most of this quantity is contained in prepared foods."', source: aps2021hydration, quote: Most of this quantity is contained in prepared foods., shots: [s027, s028, s029, s030, s031, s032, s034, s174, s175, s176], confidence: high, on_screen: true, verified: true}
- {id: c04, text: In the 1970s nutritionist Frederick Stare recommended at least six glasses a day without giving support for the number, source: aps2021hydration, shots: [s037, s038, s039, s040, s041], confidence: medium, caveat: Valtin 2002 quotes Stare's book; check the exact wording ('six to eight glasses') in the paper, verified: true}
- {id: c05, text: 'In 2002 Heinz Valtin, a Dartmouth kidney specialist and author of textbooks on the kidney and water balance, found no scientific proof that every person must drink at least eight glasses a day', source: dartmouth2002water, quote: I have found no scientific proof that absolutely every person must 'drink at least eight glasses of water a day', shots: [s044, s045, s046, s047, s048, s049, s050], confidence: high, verified: true}
- {id: c06, text: 'A lot of the water we need comes from solid food, especially fruit and vegetables', source: thedartmouth2002water, quote: 'You get lots of water from solid food, especially fruits and vegetables', shots: [s051, s052, s053], confidence: high, verified: true}
- {id: c07, text: Bread is roughly a third water, source: ljworld2002water, shots: [s054], confidence: medium, caveat: 'Journalism: ''about 35 percent''; confirm with USDA FoodData Central', verified: true}
- {id: c08, text: 'Since 2004 the US (IOM) adequate intake counts total water from all foods and liquids: 3.7 L a day for men and 2.7 L for women', source: cdc2016water, quote: from all foods and liquids at 3.7 liters (125 ounces) for men and 2.7 liters (91 ounces) for women, shots: [s057, s058, s059, s060, s061], confidence: high, verified: true}
- {id: c09, text: 'In US adults (2009-2012), plain water was 30% of men''s and 34% of women''s total water intake; the rest came from other foods and liquids', source: cdc2016water, quote: 'Among men, 30% of total water consumed was plain water (with the remainder from other foods and liquids)', shots: [s062, s063, s064, s065, s066, s067, s068], confidence: high, on_screen: true, verified: true}
- {id: c10, text: 50 habitual male coffee drinkers drank 4 cups of coffee a day for 3 days and water for 3 days; moderate coffee gave similar hydration to water, source: killer2014, quote: 'coffee, when consumed in moderation by caffeine habituated males provides similar hydrating qualities to water', shots: [s071, s072, s073, s074, s075, s076, s077, s078], confidence: high, caveat: 'Men only, habitual drinkers, 4 mg/kg caffeine; ''researchers in Britain'' = University of Birmingham, check affiliation', verified: true}
- {id: c11, text: 'A 2022 Science study measured water turnover with isotope-labelled water in 5,604 people aged 8 days to 96 years from 26 countries', source: yamada2022, shots: [s116, s117, s118, s119, s120, s121, s122, s123, s124, s125, s126], confidence: high, verified: true}
- {id: c12, text: Daily water turnover ranged from about 1 L to about 6 L, source: yamada2022, shots: [s129, s130, s131, s132], confidence: high, caveat: Outliers above 10 L/day exist; 'six times' is 6 / 1; turnover is not the same as drinking requirement, on_screen: true, verified: true}
- {id: c13, text: 'Physical activity and athletic status explained most of the variation, followed by sex, the country''s Human Development Index and age; climate also mattered; athletes turned over about 1 L more per day', source: yamada2022, quote: 'Physical activity level and athletic status explained the largest proportion of the differences in water turnover, followed by sex, the Human Development Index, and age', shots: [s133, s134, s135, s136, s137], confidence: high, verified: true}
- {id: c14, text: The authors wrote that the common suggestion to drink eight 8-oz glasses a day is not backed by objective evidence, source: yamada2022, quote: the common suggestion that we should drink 8 x 8oz glasses of water per day (approx. 2 L) is not backed by objective evidence, shots: [s138, s139, s140], confidence: high, verified: true}
- {id: c15, text: Metabolic water (made by the body when it burns food) is about 10% of water turnover, source: yamada2022, shots: [s141, s142, s143], confidence: medium, caveat: Estimate from the paper's discussion, verified: true}
- {id: c16, text: 'Predicted water turnover for a 20-year-old, 70 kg man in a mild climate (10 °C, sea level, high-HDI country, average activity) was 3.2 L/day; for a 60 kg woman 2.7 L/day', source: yamada2022, shots: [s149, s150, s151, s152, s153, s154, s155], confidence: high, caveat: Turnover includes food and metabolic water; 'more than eight glasses' compares with 1.9 L, verified: true}
- {id: c17, text: 'In the 2002 Boston Marathon, 13% of 488 sampled finishers had hyponatremia; a small number had critical levels', source: almond2005, shots: [s163, s164, s165, s166, s167, s168], confidence: high, caveat: 0.6% critical per Harvard Gazette; check the cut-off in the paper, on_screen: true, verified: true}
- {id: c18, text: 'Excessive fluid intake, shown by weight gain during the race, was the strongest factor linked to hyponatremia', source: amssm2005marathon, quote: excessive consumption of fluids is the single most important factor associated with hyponatremia, shots: [s169, s170, s171, s206, s207], confidence: high, verified: true}
- {id: c19, text: Thirst is the primary driver of fluid intake, source: aps2021hydration, quote: Thirst is the primary driver for fluid intake., shots: [s191, s192, s193, s194, s195], confidence: high, verified: true}
- {id: c20, text: 'ACSM: estimate sweat loss by weighing before and after exercise; drinking during exercise should prevent more than 2% body-weight loss from water deficit', source: acsm2007fluid, quote: The goal of drinking during exercise is to prevent excessive (>2% body weight loss from water deficit) dehydration, shots: [s198, s199, s200, s201, s202, s203, s204], confidence: high, verified: true}
- {id: c21, text: The earliest documented use of the phrase is a 1984 Illinois newspaper (Daily Herald) quote from a fitness expert about people exercising for more than an hour in summer heat, source: popik1984thirst, quote: 'If you are exercising for longer than an hour and reach a point where you feel thirsty, you already are dehydrated.', shots: [s083, s084, s085, s086, s087, s088, s089, s090, s091, s092, s093, s094], confidence: medium, caveat: Earliest use found by one etymology researcher; 'earliest in our files' wording keeps it modest, verified: true}
- {id: c22, text: Thirst begins when blood concentration has risen by less than 2%; most experts define dehydration as beginning at a rise of at least 5%, source: dartmouth2002water, quote: most experts would define dehydration as beginning when that concentration has risen by at least five percent, shots: [s095, s096, s097, s098, s099, s100], confidence: high, caveat: 'Valtin''s summary for healthy adults; during long hard exercise in heat, thirst alone may not keep up', on_screen: true, verified: true}
