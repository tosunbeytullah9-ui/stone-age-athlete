# Claims in this video → shared library (library/sources.yaml). Set verified: true after you have
# checked the quote against the source yourself. Panel: 1 · Senaryo & kaynaklar → İddialar.
claims:
- {id: c01, text: 'By the 1st century AD many free men voluntarily signed contracts with gladiator schools, including ex-soldiers and some upper-class men.', source: history-gladiators-10things, shots: [s023, s024, s025, s026, s027, s028, s029], confidence: high, verified: false}
- {id: c02, text: Pompeii graffiti describe one fighter as 'the delight of all the girls' and another who 'catches the girls at night in his net'., source: history-gladiators-10things, shots: [s030, s031, s032, s033], confidence: high, verified: false}
- {id: c03, text: 'Gladiators were a long-term investment for their lanista, expensive to house, feed and train.', source: badancient-gladiator-deaths, shots: [s037, s038, s039, s040, s041, s042], confidence: high, caveat: 'Also supported by: history-gladiators-10things', verified: false}
- {id: c04, text: 'Gaius (Institutes 3.146) discusses a contract: 20 for each gladiator returned unharmed, 1,000 for each killed or maimed.', source: edinburgh-gaius-gladiators, shots: [s043, s044, s045, s046, s047, s048, s049, s050], confidence: high, verified: false}
- {id: c05, text: Referees oversaw bouts; a defeated gladiator could signal surrender and the editor/emperor decided his fate., source: history-gladiators-10things, shots: [s056, s057, s058, s059, s060, s061, s062], confidence: high, caveat: 'Also supported by: badancient-thumbs', verified: false}
- {id: c06, text: Historians estimate between one in five and one in ten bouts left a participant dead; draws with both leaving honourably occurred., source: history-gladiators-10things, shots: [s063, s064, s065, s066, s067, s068, s069], confidence: high, caveat: 'Also supported by: badancient-gladiator-deaths', verified: false}
- {id: c07, text: 'Flamma''s epitaph (Sicily): died aged 30; 34 fights, 21 wins, 9 draws (stans), 4 times spared (missus); Syrian by birth; erected by Delicatus.', source: wiki-flamma, shots: [s070, s071, s072, s073, s074, s075, s076, s077, s078, s079, s080, s081, s089, s090, s091, s092], confidence: high, caveat: 'Also supported by: badancient-gladiator-deaths', verified: false}
- {id: c08, text: The story that Flamma was offered the rudis four times and refused is a misconception; the epitaph records four missio., source: wiki-flamma, shots: [s084, s085, s086, s087, s088, s089, s090], confidence: high, verified: false}
- {id: c09, text: 'Ephesus gladiator cemetery (found 1993, 2nd-3rd c. AD): at least 68 individuals; 11 with healed head injuries; 10 with perimortem injuries; no multiple perimortem traumata, suggesting rules were enforced.', source: kanz2006headinjuries, shots: [s097, s098, s099, s100, s101, s102, s103, s104, s105, s106, s107, s108, s109, s110, s111, s112, s113, s114, s115, s116], confidence: high, caveat: 'Also supported by: worldarch-gladiators', verified: false}
- {id: c10, text: Galen became physician to the gladiators at Pergamon in 157; only five died during his tenure versus sixty under his predecessor; he called wounds 'windows into the body'., source: wiki-galen, shots: [s122, s123, s124, s125, s126, s127, s128, s129, s130, s131, s132, s133], confidence: high, verified: false}
- {id: c11, text: Gérôme's 'Pollice Verso' (1872) popularised thumbs-down; it inspired Ridley Scott's Gladiator (2000)., source: wiki-pollice-verso, shots: [s137, s138, s139, s140, s141, s142, s143, s144, s145, s146, s147], confidence: high, caveat: 'Also supported by: badancient-thumbs', verified: false}
- {id: c12, text: Juvenal mentions 'verso pollice'; no ancient writer describes the gesture; Corbeill suggested thumbs-up meant death and thumb pressed on fist meant mercy., source: badancient-thumbs, shots: [s151, s152, s153, s154, s155, s156, s157, s158, s159], confidence: high, verified: false}
- {id: c13, text: Crowds shouted 'let him go!' or 'slay him!'; waved cloths may have signalled mercy., source: history-gladiators-10things, shots: [s162, s163, s164, s165, s166], confidence: high, verified: false}
- {id: c14, text: '''Ave Caesar, morituri te salutant'' is recorded only for Claudius''s AD 52 naumachia on Lake Fucinus, spoken by condemned criminals; Claudius answered ''aut non''; no evidence of a standard gladiator salute.', source: wiki-morituri, shots: [s169, s170, s171, s172, s173, s174, s175, s176, s177, s178, s179, s180, s181, s182, s183], confidence: high, verified: false}
- {id: c15, text: Fights without missio occurred mainly in the Republic; Augustus banned fights to the death., source: badancient-gladiator-deaths, shots: [s190, s191, s192], confidence: high, verified: false}
- {id: c16, text: Most gladiators lived only to their mid-20s., source: history-gladiators-10things, shots: [s194, s195], confidence: high, verified: false}
- {id: c17, text: 'Ephesus gladiators ate a mostly plant-based diet (barley, beans); Pliny reports the nickname ''hordearii''; high strontium suggests a plant-ash drink.', source: losch2014ephesus, shots: [s204, s205, s206, s207, s208, s209], confidence: high, caveat: 'Also supported by: bas-gladiator-diet', verified: false}
